<style>
.hidden {
  display: none;
}

#credits-container {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: black;
  color: white;
  overflow: hidden;
  text-align: center;
}

.credits-roll {
  position: absolute;
  width: 100%;
  top: 100%;
}

.rolling {
  animation: rollUp 10s linear forwards;
}

@keyframes rollUp {
  0% { top: 100%; }
  100% { top: -100%; }
}
</style>
<script>
const btn = document.getElementById('playBtn');
const container = document.getElementById('credits-container');
const roll = document.querySelector('.credits-roll');

btn.addEventListener('click', () => {
  container.classList.remove('hidden');
  roll.classList.add('rolling');
});

</script>

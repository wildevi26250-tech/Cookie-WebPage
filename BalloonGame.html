    <style>
        #balloon {
            position: absolute;
            transition: all 0.2s;
            height: 160px;
        }
    </style>
</head>
<body>

    <h1 id="scoreBox">score:0</h1>
    <img id="balloon" src="b1.png" alt="Balloon">

<script>
    var score = 0; var count = 0;
    
    var balloon = document.getElementById('balloon');
    var scoreBox = document.getElementById('scoreBox');

    balloon.addEventListener('click', clickedIt);

    function clickedIt() {
        score++;
        scoreBox.innerHTML = 'score:' + score;
        balloon.style.height = '1px';
    }

    function moveIt() {
        balloon.style.height = '160px';
        balloon.style.left = Math.random() * 800 + 'px';
        balloon.style.top = Math.random() * 600 + 'px';
        count++;
        
        if (count == 20) {
            alert('game over!');
            clearInterval(timer);
        }
    }

    var timer = setInterval(moveIt, 1000);
</script>
</body>
